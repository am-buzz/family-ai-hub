  <rect x="1200" y="446" width="64" height="40" fill="#b5372a"/>
  <path d="M1194 448 L1232 422 L1270 448 Z" fill="#8c2a20"/>
  <rect x="1222" y="458" width="22" height="28" fill="#c4452f" stroke="#f1e6d6" stroke-width="2"/>
  <path d="M1222 458 L1244 486 M1244 458 L1222 486" stroke="#f1e6d6" stroke-width="2"/>
  <rect x="1274" y="430" width="14" height="56" fill="#cfd6dc"/>
  <path d="M1274 430 q7 -12 14 0 Z" fill="#9aa6b0"/>
  <!-- the Virginia pups: one black, five tan with a little grey -->
  <g id="pups">
    <use href="#pup" transform="translate(1118 499)" color="#26262a"/>
    <use href="#pup" transform="translate(1150 504) scale(-1 1)" color="#b79c76"/>
    <use href="#pup-lying" transform="translate(1176 506)" color="#a69580"/>
    <use href="#pup" transform="translate(1205 500)" color="#bda37f"/>
    <use href="#pup" transform="translate(1236 503) scale(-1 1)" color="#a89b84"/>
    <use href="#pup-lying" transform="translate(1262 500) scale(-1 1)" color="#b39c7c"/>
  </g>
  <!-- split-rail fence -->
  <g stroke="#4a3b2e" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M1340 486 L1600 472"/><path d="M1340 497 L1600 484"/>
    <path d="M1352 480 L1352 504 M1412 478 L1412 502 M1472 474 L1472 498 M1532 471 L1532 495 M1592 468 L1592 492"/>
