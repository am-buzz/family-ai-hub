    <rect x="189.5" y="242" width="15" height="15" fill="#d52b1e"/>
    <path d="M195.8 244.4 h2.4 v4 h4 v2.4 h-4 v4 h-2.4 v-4 h-4 v-2.4 h4 Z" fill="#fff"/>
  </g>
  <!-- hazy ridges -->
  <path d="M0 410 C150 360 260 400 420 395 C600 390 700 350 900 380 C1100 410 1250 340 1400 360 C1500 372 1560 390 1600 385 L1600 520 L0 520 Z" fill="#7f9fb5"/>
  <path d="M0 440 C200 400 330 440 520 430 C760 418 900 380 1100 400 C1300 420 1450 380 1600 400 L1600 520 L0 520 Z" fill="#6f9480"/>
  <!-- Lake Léman -->
  <path d="M0 458 C200 444 400 464 640 452 C760 446 830 472 910 520 L0 520 Z" fill="url(#lake)"/>
  <path d="M60 486 q22 -9 44 0 t44 0 t44 0" fill="none" stroke="#cfe3f0" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M300 504 q22 -9 44 0 t44 0 t44 0" fill="none" stroke="#cfe3f0" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <path d="M520 482 q22 -9 44 0 t44 0" fill="none" stroke="#cfe3f0" stroke-width="5" stroke-linecap="round" opacity=".5"/>
