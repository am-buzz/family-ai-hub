      <path d="M-5.5 -5 v5 M-3 -5 v5 M3 -5 v5 M5.5 -5 v5" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <ellipse cx="0" cy="-8" rx="8" ry="4.2" fill="currentColor"/>
      <circle cx="8" cy="-11" r="3.4" fill="currentColor"/>
