  <path d="M800 238 C830 205 900 195 950 232 L930 240 L905 226 L880 244 L850 228 Z" fill="#f4f7fb"/>
  <path d="M1290 255 L1265 285 L1282 280 L1294 294 L1308 276 L1322 286 Z" fill="#f4f7fb"/>
  <path d="M600 260 L578 288 L594 283 L604 296 L618 280 L632 290 Z" fill="#f4f7fb"/>
