    </g>
    <g id="pup-lying" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7 -4 C-10 -5 -10 -8 -7.5 -8" fill="none" stroke="currentColor" stroke-width="2"/>
      <ellipse cx="0" cy="-4" rx="8" ry="3.6" fill="currentColor"/>
      <circle cx="7.6" cy="-6" r="3.3" fill="currentColor"/>
