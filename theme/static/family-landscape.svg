  <path d="M700 520 C800 470 920 440 1060 450 C1220 462 1380 420 1600 440 L1600 520 Z" fill="#587f5a"/>
  <path d="M980 520 C1080 478 1200 470 1320 478 C1440 486 1520 462 1600 470 L1600 520 Z" fill="#44704f"/>
