  <g fill="none" stroke="#e8f1f8" stroke-linecap="round">
    <path d="M420 456 C419 380 420 330 420 296" stroke-width="6"/>
    <path d="M420 300 C398 306 384 340 376 392" stroke-width="3.5" opacity=".9"/>
    <path d="M420 300 C442 306 456 340 464 392" stroke-width="3.5" opacity=".9"/>
    <path d="M420 312 C404 322 396 352 392 404" stroke-width="2.5" opacity=".7"/>
    <path d="M420 312 C436 322 444 352 448 404" stroke-width="2.5" opacity=".7"/>
  </g>
  <ellipse cx="420" cy="458" rx="34" ry="6" fill="#dbe9f3" opacity=".8"/>
  <!-- sailboat -->
  <path d="M640 482 L640 450 L668 482 Z" fill="#f4efe6"/><path d="M634 484 L674 484 L668 491 L640 491 Z" fill="#5b4a3c"/>
