# Provider registry seed for the phase 2 trust gateway. Not used by phase 1.
# Never put API keys here: keys live in ~/.family-ai/family-ai.env or the macOS keychain.
# may_receive_private_data (default false for anything not local): whether memories, knowledge-base passages,
# chat history and tool results may be sent to that provider. Set per provider by the admin, with a date.
providers:
  - id: local-ollama
    kind: ollama
    base_url: http://127.0.0.1:11434
    tier: local-only
    terms_reviewed: n/a
    may_receive_private_data: true
  - id: infomaniak
    kind: openai-compatible
    base_url: ""          # fill in from the Infomaniak console (product-specific URL)
    tier: approved
    status: provisional   # owner decision 2026-10-10: treated as approved before terms are read
    terms_reviewed: null  # TODO: record date, reviewer and link once the terms are read
    review_by: 2026-11-10 # revisit provisional status by this date
    # Admin decision 2026-10-11: the owner is comfortable with Infomaniak-hosted models receiving her own
    # memories, knowledge and chats. Other family members are told before their data can reach it (see the PRD).
    may_receive_private_data: true
  - id: ollama-cloud
    kind: ollama
    base_url: http://127.0.0.1:11434   # reached through the local Ollama app, which forwards :cloud models to Ollama's servers
    tier: unvetted
    status: provisional   # added 2026-10-21 for admin testing of minimax-m3.1-flash:cloud
    terms_reviewed: null  # TODO: read Ollama's privacy policy and cloud terms, then record date and link
    review_by: 2026-11-21
    # Ollama states (privacy policy, March 2026) that prompts and responses are processed transiently, not stored and not used for
    # training; hosting is mainly US, with possible routing to Europe and Singapore. Vendor claims, not independently verified.
    # These models look local in the picker because they go through the local Ollama connection. Keep them labelled "(cloud)".
    may_receive_private_data: false
    models: [minimax-m3.1-flash:cloud, gemma4:31b-cloud]

